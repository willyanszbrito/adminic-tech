version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adminic-booking-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_DOMAIN=api.adminic.com.br
      - APP_DOMAIN=ia.adminic.com.br
      - CORS_ORIGINS=["https://ia.adminic.com.br","http://localhost:3000","http://localhost:5173","*"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adminic-booking-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
