version: "3.8"

services:
  # 1. Backend API (FastAPI + Uvicorn)
  adminic-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adminic-api
    restart: always
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - APP_DOMAIN=ia.adminic.com.br
      - API_DOMAIN=api.adminic.com.br
      - DATABASE_URL=postgresql://adminic_user:${DB_PASSWORD:-adminic_secure_pass_2026}@postgres:5432/adminic_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-adminic_jwt_production_master_secret_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-564423794141-eum30ivtuprbv8ikk8qi6b7gapgm6a2v.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MERCADO_PAGO_PUBLIC_KEY=${MERCADO_PAGO_PUBLIC_KEY}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_ID=${META_PHONE_ID}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - adminic-data:/app/data
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - adminic-network

  # 2. Database (PostgreSQL 16 Enterprise)
  postgres:
    image: postgres:16-alpine
    container_name: adminic-postgres
    restart: always
    environment:
      POSTGRES_DB: adminic_db
      POSTGRES_USER: adminic_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminic_secure_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - adminic-network

  # 3. Cache & Distributed Rate Limiting (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: adminic-redis
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - adminic-network

volumes:
  adminic-data:
  postgres-data:
  redis-data:

networks:
  adminic-network:
    driver: bridge
